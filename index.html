    <style>
        body {
            font-family: 'PingFang TC', 'Heiti TC', 'Microsoft JhengHei', sans-serif;
            background: linear-gradient(135deg, #fdfbfb 0%, #ebedee 100%);
            min-height: 100vh;
            touch-action: manipulation; /* 增強平板觸控體驗 */
        }

        /* 填空題樣式 */
        .blank-space {
            display: inline-block;
            min-width: 100px;
            height: 40px;
            margin: 0 6px;
            vertical-align: middle;
            border-bottom: 3px dashed #9ca3af;
            text-align: center;
            line-height: 40px;
            cursor: pointer;
            transition: all 0.2s ease;
            color: #4b5563;
            font-weight: bold;
            border-radius: 6px;
            padding: 0 10px;
            background-color: #f3f4f6;
        }

        .blank-space.active {
            border-bottom: 3px solid #3b82f6;
            background-color: #eff6ff;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.3);
            transform: scale(1.05);
        }

        .blank-space.filled {
            border-bottom: 3px solid #10b981;
            background-color: #ecfdf5;
            color: #047857;
        }

        .blank-space.error {
            border-bottom: 3px solid #ef4444;
            background-color: #fef2f2;
            color: #b91c1c;
            animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both;
        }

        .blank-space.correct {
            border-bottom: 3px solid #10b981;
            background-color: #d1fae5;
            color: #047857;
        }

        /* 選擇題樣式動畫 */
        .error {
            animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both;
        }

        .word-option {
            transition: transform 0.1s;
        }
        
        .word-option:active {
            transform: scale(0.95);
        }

        @keyframes shake {
            10%, 90% { transform: translate3d(-1px, 0, 0); }
            20%, 80% { transform: translate3d(2px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
            40%, 60% { transform: translate3d(4px, 0, 0); }
        }

        @keyframes bounceIn {
            0% { transform: scale(0.3); opacity: 0; }
            50% { transform: scale(1.05); opacity: 1; }
            70% { transform: scale(0.9); }
            100% { transform: scale(1); }
        }

        .celebrate-animation {
            animation: bounceIn 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) both;
        }
    </style>
</head>

                options: ["脂", "指", "曆", "歷", "含", "念"],
                questions: [
                    { text: "1. 【脂 指】 (1) 這位藝人雖然[blank]粉未施，但仍舊明豔動人。", answers: ["脂"] },
                    { text: "　　　　　(2) 門口的[blank]示燈已經壞了，要請人來維修才行。", answers: ["指"] },
                    { text: "2. 【曆 歷】 (1) 他的學經[blank]十分豐富，是個不可多得的人才。", answers: ["歷"] },
                    { text: "　　　　　(2) 我放在桌上的日[blank]不知道被誰拿走了。", answers: ["曆"] },
                    { text: "3. 【含 念】 這一道題目包[blank]了許多不同的數學觀[blank]，需要靈活應用與熟悉課程，才容易解題。", answers: ["含", "念"] }
                ]
            }
        ];

        const App = () => {
            const [currentLevelIdx, setCurrentLevelIdx] = React.useState(0);
            const [answers, setAnswers] = React.useState({}); 
            const [activeBlankId, setActiveBlankId] = React.useState(null);
            const [validationResults, setValidationResults] = React.useState({}); 
            const [isLevelComplete, setIsLevelComplete] = React.useState(false);
            const [gameFinished, setGameFinished] = React.useState(false);
            const [showQR, setShowQR] = React.useState(false); // 新增 QR Code 彈跳視窗狀態

            const currentData = gameData[currentLevelIdx];
            const isFillBlank = currentData.type === 'fill-blank';

            // 關卡切換時初始化狀態
            React.useEffect(() => {
                if (!gameFinished) {
                    setAnswers({});
                    setValidationResults({});
                    setIsLevelComplete(false);
                    // 如果是填空題，自動 focus 第一個洞
                    if (gameData[currentLevelIdx].type === 'fill-blank') {
                        setActiveBlankId(`${currentLevelIdx}_0_0`);
                    } else {
                        setActiveBlankId(null);
                    }
                }
            }, [currentLevelIdx, gameFinished]);

            // =========== 填空題專用邏輯 ===========
            const handleBlankClick = (blankId) => {
                if (isLevelComplete || !isFillBlank) return;

                if (answers[blankId]) {
                    const newAnswers = { ...answers };
                    delete newAnswers[blankId];
                    setAnswers(newAnswers);
                    
                    const newValidations = { ...validationResults };
                    delete newValidations[blankId];
                    setValidationResults(newValidations);
                }
                setActiveBlankId(blankId);
            };

            const findNextEmptyBlank = (startBlankId) => {
                const allBlankIds = [];
                currentData.questions.forEach((q, qIdx) => {
                    const parts = q.text.split('[blank]');
                    for(let i=0; i<parts.length - 1; i++) {
                        allBlankIds.push(`${currentLevelIdx}_${qIdx}_${i}`);
                    }
                });

                let foundStart = false;
                let nextBlank = null;

                for (let i = 0; i < allBlankIds.length; i++) {
                    if (allBlankIds[i] === startBlankId) {
                        foundStart = true;
                    } else if (foundStart && !answers[allBlankIds[i]]) {
                        nextBlank = allBlankIds[i];
                        break;
                    }
                }

                if (!nextBlank) {
                    for (let i = 0; i < allBlankIds.length; i++) {
                        if (!answers[allBlankIds[i]]) {
                            nextBlank = allBlankIds[i];
                            break;
                        }
                    }
                }
                setActiveBlankId(nextBlank);
            };

            const handleWordOptionClick = (word) => {
                if (isLevelComplete || !isFillBlank) return;
                if (Object.values(answers).includes(word)) return;

                if (activeBlankId) {
                    setAnswers(prev => ({ ...prev, [activeBlankId]: word }));
                    setValidationResults(prev => {
                        const newV = {...prev};
                        delete newV[activeBlankId];
                        return newV;
                    });
                    setTimeout(() => findNextEmptyBlank(activeBlankId), 0);
                }
            };

            // =========== 選擇題專用邏輯 ===========
            const handleChoiceOptionClick = (qIdx, optIdx) => {
                if (isLevelComplete) return;
                
                setAnswers(prev => ({ ...prev, [qIdx]: optIdx }));
                setValidationResults(prev => {
                    const newV = {...prev};
                    delete newV[qIdx];
                    return newV;
                });
            };


            // =========== 共用邏輯 ===========
            const checkAnswers = () => {
                let allCorrect = true;
                const newResults = {};

                if (isFillBlank) {
                    currentData.questions.forEach((q, qIdx) => {
                        const parts = q.text.split('[blank]');
                        for(let i=0; i<parts.length - 1; i++) {
                            const blankId = `${currentLevelIdx}_${qIdx}_${i}`;
                            const userAnswer = answers[blankId];
                            const correctAnswer = q.answers[i];
                            if (userAnswer === correctAnswer) {
                                newResults[blankId] = true;
                            } else {
                                newResults[blankId] = false;
                                allCorrect = false;
                            }
                        }
                    });
                } else {
                    currentData.questions.forEach((q, qIdx) => {
                        if (answers[qIdx] === q.answer) {
                            newResults[qIdx] = true;
                        } else {
                            newResults[qIdx] = false;
                            allCorrect = false;
                        }
                    });
                }

                setValidationResults(newResults);
                if (allCorrect) setIsLevelComplete(true);
            };

            const goToNextLevel = () => {
                if (currentLevelIdx < gameData.length - 1) {
                    setCurrentLevelIdx(prev => prev + 1);
                } else {
                    setGameFinished(true);
                }
            };

            // 計算進度
            let totalBlanks = 0;
            if (isFillBlank) {
                totalBlanks = currentData?.questions.reduce((acc, q) => acc + (q.text.split('[blank]').length - 1), 0) || 0;
            } else {
                totalBlanks = currentData?.questions.length || 0;
            }
            const filledBlanksCount = Object.keys(answers).length;
            const canSubmit = filledBlanksCount === totalBlanks && !isLevelComplete;

            // 渲染填空題文字
            const renderFillBlankText = (q, qIdx) => {
                const parts = q.text.split('[blank]');
                return parts.map((part, pIdx) => {
                    if (pIdx === parts.length - 1) return <span key={pIdx}>{part}</span>;
                    
                    const blankId = `${currentLevelIdx}_${qIdx}_${pIdx}`;
                    const isFilled = !!answers[blankId];
                    const isActive = activeBlankId === blankId;
                    const isValidated = validationResults[blankId] !== undefined;
                    const isCorrect = validationResults[blankId] === true;
                    const isError = validationResults[blankId] === false;

                    let className = "blank-space";
                    if (isActive && !isLevelComplete) className += " active";
                    if (isFilled && !isValidated) className += " filled";
                    if (isCorrect) className += " correct";
                    if (isError) className += " error";

                    return (
                        <React.Fragment key={pIdx}>
                            <span>{part}</span>
                            <span 
                                className={className} 
                                onClick={() => handleBlankClick(blankId)}
                            >
                                {answers[blankId] || (isActive ? "選字..." : "")}
                            </span>
                        </React.Fragment>
                    );
                });
            };

            if (gameFinished) {
                return (
                    <div className="min-h-screen flex items-center justify-center p-4">
                        <div className="bg-white rounded-3xl shadow-2xl p-10 max-w-2xl w-full text-center celebrate-animation">
                            <i className="fa-solid fa-trophy text-6xl text-yellow-400 mb-6"></i>
                            <h1 className="text-4xl font-bold text-gray-800 mb-4">恭喜完全過關！</h1>
                            <p className="text-xl text-gray-600 mb-8">你已經成功完成了所有的語詞和選擇題挑戰，太厲害了！</p>
                            <button 
                                onClick={() => { setGameFinished(false); setCurrentLevelIdx(0); }}
                                className="bg-blue-500 hover:bg-blue-600 text-white font-bold py-4 px-10 rounded-full text-xl shadow-lg transition-transform transform hover:scale-105"
                            >
                                <i className="fa-solid fa-rotate-right mr-2"></i>再玩一次
                            </button>
                        </div>
                    </div>
                );
            }

            return (
                <div className="max-w-5xl mx-auto p-4 md:p-6 lg:p-8 flex flex-col min-h-screen">
                    {/* Header */}
                    <div className="bg-white rounded-2xl shadow-sm p-4 md:p-6 mb-6 flex justify-between items-center border-l-8 border-blue-500">
                        <div>
                            <h1 className="text-2xl md:text-3xl font-bold text-gray-800">{currentData.title}</h1>
                            <p className="text-gray-500 mt-1 md:text-lg"><i className="fa-solid fa-circle-info mr-2 text-blue-400"></i>{currentData.instructions}</p>
                        </div>
                        <div className="flex items-center gap-3">
                            <button 
                                onClick={() => setShowQR(true)} 
                                className="bg-gray-100 hover:bg-gray-200 text-gray-700 p-3 md:px-4 md:py-2 rounded-full font-bold transition-colors shadow-sm flex items-center"
                                title="顯示 QR Code"
                            >
                                <i className="fa-solid fa-qrcode md:mr-2 text-xl md:text-base"></i>
                                <span className="hidden md:inline">分享給學生</span>
                            </button>
                            <div className="bg-blue-100 text-blue-800 font-bold px-4 py-2 rounded-full hidden md:block whitespace-nowrap">
                                關卡：{currentLevelIdx + 1} / {gameData.length}
                            </div>
                        </div>
                    </div>

                    {/* Questions Area */}
                    <div className={`bg-white rounded-2xl shadow-sm p-6 md:p-8 mb-6 ${!isFillBlank ? '' : 'flex-grow'}`}>
                        <div className="space-y-6">
                            
                            {/* 渲染填空題 */}
                            {isFillBlank && currentData.questions.map((q, qIdx) => (
                                <div key={qIdx} className="text-xl md:text-2xl leading-relaxed text-gray-700">
                                    {renderFillBlankText(q, qIdx)}
                                </div>
                            ))}

                            {/* 渲染選擇題 */}
                            {!isFillBlank && currentData.questions.map((q, qIdx) => (
                                <div key={qIdx} className="bg-gray-50 rounded-2xl p-5 md:p-7 border border-gray-100 shadow-sm">
                                    <h3 className="text-xl md:text-2xl font-bold text-gray-800 mb-5 leading-snug">{q.text}</h3>
                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                        {q.options.map((opt, optIdx) => {
                                            const isSelected = answers[qIdx] === optIdx;
                                            const isValidated = validationResults[qIdx] !== undefined;
                                            const isCorrect = validationResults[qIdx] === true;
                                            const isError = validationResults[qIdx] === false;
                                            
                                            let btnClass = "text-left px-5 py-4 rounded-xl border-2 transition-all duration-200 text-lg md:text-xl font-medium cursor-pointer flex items-center ";
                                            
                                            if (isLevelComplete) {
                                                if (optIdx === q.answer) {
                                                    btnClass += "bg-green-100 border-green-500 text-green-800 shadow-sm";
                                                } else if (isSelected) {
                                                    btnClass += "bg-red-50 border-red-300 text-red-500 opacity-60";
                                                } else {
                                                    btnClass += "bg-white border-gray-200 text-gray-400 opacity-60";
                                                }
                                            } else if (isValidated && isSelected) {
                                                if (isCorrect) {
                                                     btnClass += "bg-green-100 border-green-500 text-green-800 shadow-sm";
                                                } else {
                                                     btnClass += "bg-red-50 border-red-500 text-red-700 error"; 
                                                }
                                            } else {
                                                if (isSelected) {
                                                    btnClass += "bg-blue-100 border-blue-500 text-blue-800 shadow-md transform scale-[1.02]";
                                                } else {
                                                    btnClass += "bg-white border-gray-300 text-gray-700 hover:bg-gray-100 hover:border-gray-400";
                                                }
                                            }

                                            const optionLabels = ['①', '②', '③', '④'];

                                            return (
                                                <div 
                                                    key={optIdx}
                                                    onClick={() => handleChoiceOptionClick(qIdx, optIdx)}
                                                    className={btnClass}
                                                >
                                                    <span className="inline-block font-bold mr-3 text-2xl text-gray-400">
                                                        {optionLabels[optIdx]}
                                                    </span>
                                                    <span className="flex-grow">{opt}</span>
                                                    
                                                    {isValidated && isSelected && isCorrect && <i className="fa-solid fa-circle-check ml-2 text-green-500 text-2xl"></i>}
                                                    {isValidated && isSelected && isError && <i className="fa-solid fa-circle-xmark ml-2 text-red-500 text-2xl"></i>}
                                                </div>
                                            )
                                        })}
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>

                    {/* Bottom Actions (Sticky for easy access) */}
                    <div className="sticky bottom-4 z-10 bg-white/95 backdrop-blur-md rounded-2xl shadow-lg p-6 border-2 border-gray-100 mt-auto">
                        
                        {/* 僅填空題顯示語詞庫 */}
                        {isFillBlank && !isLevelComplete && (
                            <div className="mb-6">
                                <h3 className="text-lg font-bold text-gray-600 mb-3 border-b pb-2"><i className="fa-solid fa-box-open mr-2"></i>語詞庫 (請點擊選擇)</h3>
                                <div className="flex flex-wrap gap-3">
                                    {currentData.options.map((option, idx) => {
                                        const isUsed = Object.values(answers).includes(option);
                                        return (
                                            <button
                                                key={idx}
                                                disabled={isUsed}
                                                onClick={() => handleWordOptionClick(option)}
                                                className={`word-option px-5 py-3 rounded-xl font-bold text-xl border-2 shadow-sm
                                                    ${isUsed 
                                                        ? 'bg-gray-100 text-gray-400 border-gray-200 cursor-not-allowed' 
                                                        : 'bg-white text-blue-600 border-blue-200 hover:bg-blue-50 hover:border-blue-300'
                                                    }`}
                                            >
                                                {option}
                                            </button>
                                        );
                                    })}
                                </div>
                            </div>
                        )}

                        {/* Status and Action Buttons */}
                        <div className="flex justify-between items-center mt-2">
                            <div className="text-lg font-medium">
                                {!isLevelComplete && (
                                    <span className={filledBlanksCount === totalBlanks ? "text-green-600" : "text-gray-500"}>
                                        作答進度：{filledBlanksCount} / {totalBlanks}
                                    </span>
                                )}
                            </div>
                            
                            <div>
                                {canSubmit && (
                                    <button 
                                        onClick={checkAnswers}
                                        className="bg-yellow-400 hover:bg-yellow-500 text-yellow-900 font-bold py-3 px-8 rounded-full text-xl shadow-md transition-transform transform hover:scale-105"
                                    >
                                        <i className="fa-solid fa-paper-plane mr-2"></i>送出答案
                                    </button>
                                )}
                                
                                {isLevelComplete && (
                                    <div className="flex items-center gap-4">
                                        <span className="text-green-600 font-bold text-xl hidden sm:inline-block"><i className="fa-solid fa-circle-check mr-2"></i>完全正確！</span>
                                        <button 
                                            onClick={goToNextLevel}
                                            className="bg-green-500 hover:bg-green-600 text-white font-bold py-3 px-8 rounded-full text-xl shadow-md transition-transform transform hover:scale-105"
                                        >
                                            {currentLevelIdx === gameData.length - 1 ? '完成挑戰！' : '前往下一關'} <i className="fa-solid fa-arrow-right ml-2"></i>
                                        </button>
                                    </div>
                                )}
                            </div>
                        </div>
                    </div>
                    
                    {/* QR Code Modal (彈跳視窗) */}
                    {showQR && (
                        <div className="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-center justify-center p-4" onClick={() => setShowQR(false)}>
                            <div className="bg-white rounded-3xl p-8 shadow-2xl text-center max-w-sm w-full relative celebrate-animation" onClick={e => e.stopPropagation()}>
                                <button onClick={() => setShowQR(false)} className="absolute top-4 right-4 text-gray-400 hover:text-gray-700 text-3xl">
                                    <i className="fa-solid fa-xmark"></i>
                                </button>
                                <h2 className="text-2xl font-bold text-gray-800 mb-2">掃描進入闖關</h2>
                                <p className="text-gray-500 mb-6">讓學生用平板掃描 QR Code</p>
                                <div className="bg-white p-2 rounded-xl border-4 border-gray-100 inline-block">
                                    <img 
                                        src={`https://api.qrserver.com/v1/create-qr-code/?size=250x250&data=${encodeURIComponent(window.location.href)}`} 
                                        alt="QR Code" 
                                        className="w-48 h-48 md:w-56 md:h-56 object-contain"
                                    />
                                </div>
                                <div className="mt-6 text-xs text-gray-400 break-all px-2">
                                    {window.location.href}
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
