<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>特教國語遊戲網 - 總大廳</title>
    <script src="data.js"></script>
    <style>
        /* 強制滿版，絕對不出現捲軸 */
        body { 
            font-family: "Microsoft JhengHei", sans-serif; 
            background-color: #ecf0f1; 
            margin: 0; 
            padding: 1.5vh 1.5vw; 
            height: 100vh; /* 鎖死高度為視窗 100% */
            width: 100vw; 
            box-sizing: border-box; 
            overflow: hidden; /* 隱藏捲軸 */
            display: flex; 
            align-items: center; 
            justify-content: center;
        }

        /* 內層溫暖的奶油色大看板，自動填滿剩餘可用空間 */
        .main-container {
            width: 100%; 
            height: 100%; /* 撐滿 body 減去 padding 的空間 */
            max-width: 1600px; /* 放大最大寬度，讓大電視更好看 */
            background-color: #fff9e6; 
            border-radius: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1); 
            display: flex; 
            flex-direction: column; 
            padding: 2vh 3vw; 
            box-sizing: border-box; 
            position: relative;
        }

        /* 頂部標題區：固定高度不壓縮 */
        .header-area { 
            text-align: center; 
            flex: 0 0 auto; 
            margin-bottom: 1.5vh; 
        }
        h1 { 
            color: #5a4a42; 
            font-size: clamp(32px, 4.5vh, 60px); 
            margin: 0 0 0.5vh 0; 
            letter-spacing: 2px;
        }
        .subtitle { 
            font-size: clamp(16px, 2vh, 24px); 
            color: #8d6e63; 
            margin: 0; 
        }

        /* 區塊標題 */
        .section-title {
            width: 100%; 
            text-align: left;
            color: #8d6e63;
            font-size: clamp(18px, 2.5vh, 26px);
            font-weight: bold;
            margin: 0.5vh 0 1vh 0.5vw;
            flex: 0 0 auto; /* 標題不壓縮 */
        }

        /* 網格共同設定：依比例分配高度 */
        .grid-container {
            width: 100%;
            display: grid;
            gap: 1.5vh 1.5vw;
            box-sizing: border-box;
            min-height: 0; /* 關鍵：防止 flex 子元素撐破容器 */
        }

        /* 課文區塊網格 (佔最大比例 3 份) */
        .lesson-list { 
            flex: 3; 
            grid-template-columns: repeat(4, 1fr); 
            grid-template-rows: repeat(3, minmax(0, 1fr)); /* 每列平均分配剩餘高度 */
            margin-bottom: 1vh;
        }

        /* 複習考區塊網格 (佔比例 1 份) */
        .review-list {
            flex: 1;
            grid-template-columns: repeat(4, 1fr); 
            grid-template-rows: minmax(0, 1fr);
            padding-top: 1.5vh;
            border-top: 3px dashed #d7ccc8;
        }

        /* 分組探險測驗區塊網格 (佔比例 1 份) */
        .adventure-list {
            flex: 1;
            grid-template-columns: repeat(4, 1fr); 
            grid-template-rows: minmax(0, 1fr);
            padding-top: 1.5vh;
            border-top: 3px dashed #ffe082;
        }

        /* 共用按鈕設計，維持大面積且自動填滿網格 */
        .card-btn { 
            background-color: #ffffff; 
            border-radius: 15px; 
            text-decoration: none; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            transition: 0.2s; 
            padding: 1vh 1vw; 
            text-align: center; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.05); 
            color: #333;
            font-size: clamp(18px, 2.8vh, 32px); 
            font-weight: bold; 
            line-height: 1.3;
            width: 100%; 
            height: 100%; /* 強制按鈕高度填滿網格 */
            box-sizing: border-box;
            cursor: pointer;
        }

        .card-btn:active { transform: scale(0.96); box-shadow: none; background-color: #e3f2fd;}

        /* 給不同課文不同顏色的邊框 */
        .lesson-card:nth-child(4n+1) { border: 4px solid #e74c3c; } 
        .lesson-card:nth-child(4n+2) { border: 4px solid #f39c12; } 
        .lesson-card:nth-child(4n+3) { border: 4px solid #2ecc71; } 
        .lesson-card:nth-child(4n+4) { border: 4px solid #3498db; } 

        /* 複習考專屬樣式 */
        .review-card { border: 4px solid #9b59b6; background-color: #faf5ff; }
        .review-card:active { background-color: #f3e5f5; }

        /* 探險測驗專屬樣式 */
        .adventure-card { border: 4px solid #f39c12; background-color: #fff8e1; }
        .adventure-card:active { background-color: #ffecb3; }
        
        /* ================= QR Code 專屬樣式 ================= */
        .qr-btn {
            position: fixed; 
            top: 3vh; /* 改到右上角避免擋住底部測驗按鈕 */
            right: 3vw;
            background-color: #2c3e50; color: white;
            border: 3px solid #fff; border-radius: 50px;
            padding: 1vh 1.5vw; 
            font-size: clamp(14px, 2vh, 20px);
            font-weight: bold; cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            z-index: 100; transition: 0.2s;
            display: flex; align-items: center; gap: 8px;
        }
        .qr-btn:active { transform: scale(0.95); background-color: #1a252f; }

        /* QR Code 遮罩與彈出視窗 */
        .qr-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0,0,0,0.8); display: none;
            align-items: center; justify-content: center; z-index: 1000;
        }
        .qr-box {
            background: #fff9e6; padding: 4vh 4vw; border-radius: 30px;
            text-align: center; box-shadow: 0 15px 40px rgba(0,0,0,0.4);
            border: 6px solid #f39c12;
            display: flex; flex-direction: column; align-items: center;
        }
        .qr-box h2 { color: #d35400; font-size: clamp(24px, 3.5vh, 40px); margin: 0 0 2vh 0; }
        .qr-box img { width: 30vh; height: 30vh; min-width: 200px; min-height: 200px; margin-bottom: 3vh; border: 10px solid white; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .close-qr {
            background: #e74c3c; color: white; border: none; padding: 1.5vh 3vw;
            border-radius: 15px; font-size: clamp(18px, 2.5vh, 28px); font-weight: bold; cursor: pointer;
            width: 100%; box-shadow: 0 4px 0 #c0392b;
        }
        .close-qr:active { transform: translateY(3px); box-shadow: none; }

    </style>
</head>
<body>
    <div class="main-container">
        <div class="header-area">
            <h1>🏫 特教國語遊戲網 🎪</h1>
            <p class="subtitle">請選擇今天要挑戰的課程或測驗！</p>
        </div>
        
        <div class="section-title">📖 一般課文</div>
        <div class="grid-container lesson-list" id="lesson-container"></div>
        
        <div class="section-title">🎯 階段複習</div>
        <div class="grid-container review-list" id="review-container">
            <a href="review.html?id=review1" class="card-btn review-card">複習考 1</a>
            <a href="review.html?id=review2" class="card-btn review-card">複習考 2</a>
            <a href="review.html?id=review3" class="card-btn review-card">複習考 3</a>
            <a href="review.html?id=review4" class="card-btn review-card">複習考 4</a>
        </div>

        <div class="section-title">🗺️ 分組探險測驗</div>
        <div class="grid-container adventure-list">
            <a href="quiz_multi_group_full.html" class="card-btn adventure-card" style="grid-column: span 2;">語文探險之旅</a>
        </div>
    </div>

    <button class="qr-btn" onclick="showQR()">📱 掃描登入</button>

    <div class="qr-overlay" id="qrOverlay" onclick="hideQR(event)">
        <div class="qr-box" onclick="event.stopPropagation()">
            <h2>請用平板掃描進入</h2>
            <img id="qrImage" src="" alt="QR Code">
            <button class="close-qr" onclick="hideQR(event)">關閉</button>
        </div>
    </div>

    <script>
        // ================= 1. 生成課文按鈕 =================
        window.onload = function() {
            const container = document.getElementById('lesson-container');
            
            if (typeof allLessonsData !== 'undefined') {
                for (let lessonId in allLessonsData) {
                    const lessonInfo = allLessonsData[lessonId];
                    const card = document.createElement('a');
                    
                    card.href = `lesson.html?id=${lessonId}`; 
                    card.className = 'card-btn lesson-card';
                    card.innerText = lessonInfo.title;
                    
                    container.appendChild(card);
                }
            } else {
                container.innerHTML = '<h2 style="color:red; text-align:center; grid-column: 1/-1;">找不到資料庫 (data.js) 喔！請確認檔案有上傳。</h2>';
            }
        };

        // ================= 2. QR Code 控制邏輯 =================
        function showQR() {
            const currentUrl = encodeURIComponent(window.location.href);
            document.getElementById('qrImage').src = `https://api.qrserver.com/v1/create-qr-code/?size=400x400&data=${currentUrl}`;
            document.getElementById('qrOverlay').style.display = "flex";
        }

        function hideQR(e) {
            document.getElementById('qrOverlay').style.display = "none";
        }
    </script>
</body>
</html>
