<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>階段複習考</title>
    <script src="data.js"></script>
    <style>
        /* 基礎背景與字體 */
        body { 
            font-family: "Microsoft JhengHei", sans-serif; 
            background-color: #f3e5f5; /* 搭配複習考的紫色系 */
            margin: 0; padding: 2vh 2vw; 
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            height: 100vh; width: 100vw; box-sizing: border-box; overflow: hidden;
        }

        /* 遊戲主畫面容器 */
        .game-board {
            width: 100%; max-width: 1000px;
            background-color: #ffffff; 
            border-radius: 40px;
            border: 8px solid #9b59b6;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15); 
            display: flex; flex-direction: column; align-items: center; 
            padding: 4vh 4vw; box-sizing: border-box;
            text-align: center;
        }

        /* 題目區文字放大，適合大屏閱讀 */
        #question-text {
            font-size: clamp(28px, 4.5vh, 48px);
            color: #333;
            font-weight: bold;
            margin-bottom: 4vh;
            line-height: 1.5;
            min-height: 15vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* 選項按鈕區 (Click-based) */
        .options-container {
            display: grid;
            grid-template-columns: repeat(2, 1fr); /* 一排兩個選項 */
            gap: 2vh 2vw;
            width: 100%;
        }

        /* 大面積按鈕設計 */
        .option-btn {
            background-color: #faf5ff;
            border: 4px solid #ce93d8;
            border-radius: 20px;
            padding: 3vh 2vw;
            font-size: clamp(24px, 3.5vh, 40px);
            font-weight: bold;
            color: #5e35b1;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 6px 10px rgba(0,0,0,0.05);
        }

        .option-btn:active {
            transform: scale(0.95);
            background-color: #e1bee7;
        }

        /* 頂部進度條與返回按鈕區 */
        .top-bar {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 3vh;
        }

        .back-btn {
            background-color: #ffcc80;
            border: none; border-radius: 15px;
            padding: 1.5vh 2vw;
            font-size: clamp(18px, 2.5vh, 24px);
            font-weight: bold; color: #d84315;
            cursor: pointer; text-decoration: none;
        }

        .progress {
            font-size: clamp(20px, 3vh, 28px);
            font-weight: bold; color: #8e24aa;
        }

        /* 回饋動畫字體 */
        #feedback-msg {
            font-size: clamp(24px, 3.5vh, 36px);
            font-weight: bold;
            height: 5vh;
            margin-top: 2vh;
        }
    </style>
</head>
<body>

    <div class="game-board">
        <div class="top-bar">
            <a href="index.html" class="back-btn">🏠 回大廳</a>
            <div class="progress" id="progress-text">題數: 0 / 0</div>
        </div>

        <div id="question-text">讀取題目中...</div>
        
        <div class="options-container" id="options-box">
            </div>

        <div id="feedback-msg"></div>
    </div>

    <script>
        // 1. 從網址取得現在是哪個測驗 (例如 review.html?id=review1)
        const urlParams = new URLSearchParams(window.location.search);
        const reviewId = urlParams.get('id');

        // 2. 對應到 data.js 裡的變數
        const dataMap = {
            'review1': typeof review1Data !== 'undefined' ? review1Data : [],
            'review2': typeof review2Data !== 'undefined' ? review2Data : [],
            'review3': typeof review3Data !== 'undefined' ? review3Data : [],
            'review4': typeof review4Data !== 'undefined' ? review4Data : []
        };

        const currentQuizData = dataMap[reviewId];
        let currentIndex = 0;
        let score = 0;

        const questionEl = document.getElementById('question-text');
        const optionsBox = document.getElementById('options-box');
        const progressEl = document.getElementById('progress-text');
        const feedbackEl = document.getElementById('feedback-msg');

        // 3. 啟動測驗
        function initQuiz() {
            if (!currentQuizData || currentQuizData.length === 0) {
                questionEl.innerText = "找不到題目，請確認題庫是否有資料！";
                return;
            }
            loadQuestion();
        }

        // 4. 載入每一題的畫面
        function loadQuestion() {
            feedbackEl.innerText = "";
            feedbackEl.style.color = "transparent"; // 清空回饋文字

            const currentQ = currentQuizData[currentIndex];
            questionEl.innerText = currentQ.question;
            progressEl.innerText = `題數: ${currentIndex + 1} / ${currentQuizData.length}`;
            
            // 清空舊選項，產生大按鈕
            optionsBox.innerHTML = "";
            currentQ.options.forEach((opt, index) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = opt;
                // Click-based 設計，點擊即作答
                btn.onclick = () => checkAnswer(index, currentQ.correctAnswerIndex);
                optionsBox.appendChild(btn);
            });
        }

        // 5. 判斷對錯與過場
        function checkAnswer(selectedIndex, correctIndex) {
            // 避免學生狂點，先將所有按鈕鎖住
            const buttons = document.querySelectorAll('.option-btn');
            buttons.forEach(btn => btn.disabled = true);

            if (selectedIndex === correctIndex) {
                score++;
                feedbackEl.innerText = "✨ 兔兔說：太棒了！答對啦！ ✨";
                feedbackEl.style.color = "#2e7d32";
            } else {
                feedbackEl.innerText = "💡 阿白說：哎呀，再接再厲！";
                feedbackEl.style.color = "#c62828";
            }

            // 等待 1.5 秒後進入下一題
            setTimeout(() => {
                currentIndex++;
                if (currentIndex < currentQuizData.length) {
                    loadQuestion();
                } else {
                    showResult();
                }
            }, 1500);
        }

        // 6. 結算畫面
        function showResult() {
            questionEl.innerHTML = `測驗結束！<br>你總共答對了 ${score} 題！🎉`;
            optionsBox.innerHTML = `
                <button class="option-btn" onclick="location.reload()" style="grid-column: 1 / -1;">再來一次</button>
                <button class="option-btn" onclick="location.href='index.html'" style="grid-column: 1 / -1; background-color:#fff3e0; border-color:#ffb74d; color:#e65100;">返回大廳</button>
            `;
            progressEl.innerText = "完成！";
            feedbackEl.innerText = "";
        }

        // 頁面載入後自動執行
        window.onload = initQuiz;

    </script>
</body>
</html>
